deliverables:
- item: Notification and inbox center as a complete workflow
  result: pass
  evidence: a bell in the top bar of every role shell shows the unread count (named for assistive technology, capped at 99+) and opens a panel with the latest eight messages (subject, body clamped to three lines, event, time), a New status and a Mark read button per unread message, All messages (for roles that have a Messages destination) and Notification preferences (opens the profile disclosure). Opening it marks nothing; reading is explicit. Organizers, who had no inbox UI at all, now have one.
- item: Reuses the canonical primitive and existing endpoints
  result: pass
  evidence: one hook, useInbox, over the existing GET /inbox/ and POST /inbox/{id}/read/ with the existing query key and the realtime hint (workspace:<id>:inbox); the Messages destination card was refactored onto it, so there is one query, one cache entry and one mark-read path; preferences stay the NOTIFICATIONS screen; no endpoint, table or SDK change
