- item: Global entity search through the canonical query layer
  result: pass
  evidence: the header Search opens a dialog (accessible combobox and listbox, arrow keys and Enter, Escape) that finds places and events by name for every role and, for roles whose own entity catalogue offers them, the records of the selected event - each entity asked once with a contains filter on its label field through the universal query engine (QUERY primitive, GET entities/{key}/), at most five hits per entity, grouped under the entity's name with a second field beside the title. Typing is debounced (200 ms), reads go through the server-state layer (a newer query cancels the one in flight, a repeated query is cached), and a hit opens at its view and section through routes.target with the event; the typed text never enters a URL.
