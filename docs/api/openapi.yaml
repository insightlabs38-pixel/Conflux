components:
  schemas:
    AbuseSignalSchema:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        signal_type:
          type: string
        detail:
          type: string
        evidence: {}
        occurred_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolved_by:
          type: string
          format: uuid
          nullable: true
        resolution_note:
          type: string
      required:
      - detail
      - evidence
      - occurred_at
      - public_id
      - resolution_note
      - resolved_at
      - resolved_by
      - signal_type
    AccessEnum:
      enum:
      - roles
      - any_authenticated
      - public
      - unknown
      type: string
      description: |-
        * `roles` - roles
        * `any_authenticated` - any_authenticated
        * `public` - public
        * `unknown` - unknown
    AccessibilityWarning:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/CategoryEnum'
        severity:
          type: string
        message:
          type: string
        block_public_id:
          type: string
          format: uuid
          nullable: true
      required:
      - block_public_id
      - category
      - message
      - severity
    ActionEnum:
      enum:
      - submit
      - join
      - advance
      - vote
      - award
      type: string
      description: |-
        * `submit` - Submit
        * `join` - Join
        * `advance` - Advance
        * `vote` - Vote
        * `award` - Award
    AddProjectMemberInput:
      type: object
      properties:
        user:
          type: string
          format: uuid
      required:
      - user
    AdvancedSubjectSchema:
      type: object
      properties:
        subject_type:
          type: string
        subject_id:
          type: string
      required:
      - subject_id
      - subject_type
    AdvancementCandidateSchema:
      type: object
      properties:
        subject_type:
          type: string
        subject_id:
          type: string
        score:
          type: number
          format: double
          nullable: true
        track_id:
          type: string
          nullable: true
      required:
      - subject_id
      - subject_type
    AdvancementEvidenceSchema:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        actor:
          type: string
          nullable: true
        stage_public_id:
          type: string
        metadata: {}
      required:
      - actor
      - created_at
      - metadata
      - stage_public_id
    AdvancementInputSchema:
      type: object
      properties:
        to_stage:
          type: string
          format: uuid
        strategy:
          type: string
        params: {}
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/AdvancementCandidateSchema'
      required:
      - candidates
      - strategy
      - to_stage
    AdvancementResultSchema:
      type: object
      properties:
        advanced:
          type: array
          items:
            $ref: '#/components/schemas/AdvancedSubjectSchema'
      required:
      - advanced
    AdvancementStrategiesSchema:
      type: object
      properties:
        strategies:
          type: array
          items:
            type: string
      required:
      - strategies
    AgreementCriterionSchema:
      type: object
      properties:
        project:
          type: string
          format: uuid
        project_name:
          type: string
        criterion_id:
          type: string
        scores:
          type: object
          additionalProperties:
            type: number
            format: double
        mean:
          type: number
          format: double
        range:
          type: number
          format: double
        stdev:
          type: number
          format: double
      required:
      - criterion_id
      - mean
      - project
      - project_name
      - range
      - scores
      - stdev
    AgreementRankingSchema:
      type: object
      properties:
        judge_a:
          type: string
          format: uuid
        judge_b:
          type: string
          format: uuid
        shared_candidates:
          type: integer
        tau:
          type: number
          format: double
          nullable: true
      required:
      - judge_a
      - judge_b
      - shared_candidates
      - tau
    AgreementSummarySchema:
      type: object
      properties:
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/AgreementCriterionSchema'
        rankings:
          type: array
          items:
            $ref: '#/components/schemas/AgreementRankingSchema'
      required:
      - criteria
      - rankings
    Announcement:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 160
        body:
          type: string
          maxLength: 4000
        posted_by:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        hidden_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        version:
          type: integer
          readOnly: true
      required:
      - created_at
      - hidden_at
      - posted_by
      - public_id
      - title
      - version
    AnnouncementReviewInput:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/AnnouncementReviewInputStatusEnum'
        note:
          type: string
          maxLength: 2000
      required:
      - note
      - status
      - version
    AnnouncementReviewInputStatusEnum:
      enum:
      - published
      - hidden
      type: string
      description: |-
        * `published` - published
        * `hidden` - hidden
    AnnouncementReviewOutput:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        version:
          type: integer
          readOnly: true
        hidden_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - body
