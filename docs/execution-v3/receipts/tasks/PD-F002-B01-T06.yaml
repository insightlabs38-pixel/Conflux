findings:
- Review found that an expired request refused on decide was not persisted because the refusal rolled back the same transaction; the expiry is now recorded and reported after commit
- The browser fixture has one organizer, so the second person's approval is proved by integration tests; the browser spec proves the hold, the visibility, the missing self-approval and the withdrawal
- A controlled checkbox follows the server answer, so the spec clicks and then asserts the state rather than using check
limitations:
- Deciders are not notified; they find requests in Operations > Approvals
- No delegation, thresholds or gating of the other bulk actions; two different send operations in one batch need one approval each, one after another
- The request stores a summary and a digest instead of a payload snapshot
- On a single-organizer event only an admin can approve, so gates stay opt-in
