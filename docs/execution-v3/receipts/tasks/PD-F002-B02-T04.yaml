findings:
- The contract named categories approval and job, but nothing sends them; they are not registered so the profile does not offer a toggle for an unsent notice (recorded in spec 002 and the guide)
- The mention notice had no email before; it now emails only people who opted in (default off), the one place delivery gained behavior
- An affected-spec rule that matched the whole profile folder broke an existing exact-selection test; narrowed to the notification files and ProfilePanel
limitations:
- No per-event or push notification choices, and no digest or quiet hours
