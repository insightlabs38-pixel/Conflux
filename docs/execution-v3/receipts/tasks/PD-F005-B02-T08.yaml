deliverables:
- item: Configurable density (comfortable, compact, high density) as a complete workflow
  result: pass
  evidence: the account menu has a Table density choice (three radios) and the palette has three commands; the choice is the person's (device-local through shellPreferences, forgotten at sign-out), applied to the app's own screens as data-density on the document by useAppDensity in the workspace shell, and never changed by the viewport. Comfortable is today's look and sets no attribute; compact (about 40px rows) and high density (about 32px) set the cell padding token, and high density also gives controls inside a table their small height on a fine pointer from 768px up only.
- item: Reuses the data grid and keeps a grid view's own setting
  result: pass
  evidence: the tokens drive the shell's table cells (the rule the DataGrid and EntityGrid tables use); a grid view's own compact setting is more specific and still wins for that grid; the saved-view schema (compact or comfortable) is unchanged, so no server contract moved
- item: States, keyboard, accessibility, touch
  result: pass
  evidence: native radios in a fieldset with a legend; controls keep 44px on touch (browser test at 390 asserts the search control and the bottom bar are unchanged and at least 44px with high density chosen); the choice survives a reload and is cleared at sign-out
