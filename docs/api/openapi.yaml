            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
          description: ''
  /api/v1/workspaces/:
    post:
      operationId: post_api_v1_workspaces
      description: |-
        Dedupe unsafe requests by a client-supplied `Idempotency-Key` header.

        Put before the DRF view class in the MRO. Requests without the header are
        passed through untouched, so normal (non-idempotent) callers see no change.
        A replayed key with a different body is rejected rather than silently
        served the stale response.
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceInputSchema'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkspaceInputSchema'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkspaceInputSchema'
        required: true
      security:
      - sessionCookie: []
      - scopedBearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSchema'
          description: ''
