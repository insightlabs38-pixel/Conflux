findings:
- P2 the workspace audit log endpoint had no way to bound or scope its answer (it returned every row); the new limit makes a bounded read possible, but other consumers still read all rows when they pass nothing.
- P3 the grid's Registration and Projects sections are both mounted, so a finder must scope to the grid it means.
