- id: ART-006
  batch: C-B09
  phase: core
  title: Cross-provider S3 storage contract
  goal: Prove the Conflux generic S3 adapter relies on shared S3 semantics across RustFS and SeaweedFS; use one
    reusable contract suite and keep both providers out of the ordinary default runtime except RustFS.
  task_dependencies:
  - ART-002
  status: DONE
  batch_dependencies:
  - C-B01
  - C-B08
  preferred_executor: codex-sol
  bulk_eligible: true
  risk: medium
  owned_paths:
  - src/api/artifacts/**
  - tests/storage/**
  required_reading:
  - AGENTS.md
  - BATCHES.yaml#C-B09
  - 05_TECH_STACK_AND_OFFLINE_RUNTIME.md
  - 12_API_WEBHOOKS_PORTABILITY.md
  - 18_TESTING_VERIFICATION_STRATEGY.md
  acceptance:
  - RustFS and SeaweedFS pass the same generic S3 adapter contract
  - PUT/GET/HEAD/DELETE/LIST-prefix, overwrite, missing and zero-byte objects, metadata, unusual Unicode keys, presigned
    PUT/GET and expiry/signature failures are covered
  - multipart and concurrent independent uploads are covered when used by Conflux
  - RustFS remains the default runtime and SeaweedFS remains an opt-in compatibility profile
  - focused tests and concise receipt are provided
  escalate_if:
  - provider behavior requires provider-specific domain logic
  - signature or object semantics differ unexpectedly
  - security, concurrency or data-integrity invariant is unclear
