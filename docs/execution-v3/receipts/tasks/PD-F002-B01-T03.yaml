- item: Real adopters, not a demo
  result: pass
  evidence: the applications list in Participants Registration replaces a hand-written list (decide actions are row actions and the grid reloads after a decision) and a new Projects list appears in Participants; both run on the fixture event in the browser
- item: States and accessibility
  result: pass
  evidence: native table with caption, scope and aria-sort; selection checkboxes that move with the arrow keys, Home, End and Page keys; loading, empty, filtered-empty, error with retry and denied states; stacked card layout on narrow screens with a Sort by select because the header is hidden there; axe and no horizontal overflow at 390 and 1440
- item: Saved views mounted and proven in the browser
  result: pass
  evidence: entity-grid.spec saves, reopens from a link, changes, rejects an unknown id and deletes a view; a real defect was found and fixed, a shared view param made each list on a page drop the other list's views, so the param is now one per entity (view_applications)
invariants:
- item: Server authoritative, no client-side set logic
  result: pass
  evidence: the grid only renders the rows it is given; filters, sorts and columns are request parameters; selection is the ids the server returned
- item: No duplicate source of truth
  result: pass
  evidence: one catalogue drives columns, operators and choices; nothing is hard-coded per list beyond renderers and actions
