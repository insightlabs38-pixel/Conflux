task: PD-F001-B02-T02
batch: PD-F001-B02
category: data_integrity
severity: P2
status: RESOLVED
summary: A draft event, or a stage, whose judging has a published rubric cannot be deleted; preset events now always have one, and the delete endpoints failed with an unhandled error.
observed:
- "RubricVersion.plan is PROTECT and RubricVersion.delete raises: published rubric versions are permanent. Stage and Event deletion cascade to the plan, so they hit ProtectedError."
- "Before this task, DELETE on such a stage or draft event returned HTTP 500 (probed on a hackathon preset event). PD-F001-B01-T03 made a published rubric part of every preset event, so the day-one path now creates events that can never be deleted."
- "Event deletion is documented as allowed for draft events only."
attempts:
- Probed both endpoints; used Django's deletion collector to see exactly what blocks; checked that the preview and endpoint can share one answer.
decision_needed: May a draft event, or a stage, whose only published rubric version has never been used (no ballots) be deleted, which would need a deliberate exception to rubric immutability?
options:
- option: A, refuse cleanly and say why (implemented as the default)
  tradeoff: Keeps the immutability invariant untouched and removes the 500; an organizer who created a preset event by mistake cannot delete it (archiving needs open, closed and archived in turn).
- option: B, allow deleting an unused published rubric together with its draft event or stage
  tradeoff: Fixes the dead end but creates a sanctioned way around rubric immutability and needs a definition of unused that covers ballots, assignments, appeals and exports.
- option: C, do not publish the rubric at creation
  tradeoff: Undoes the PD-F001-B01-T03 real-defaults decision (judges could not be invited without re-entering criteria).
recommended: A now; the owner may choose B with a precise definition of unused.
affected_invariants:
- Published rubric versions are immutable and permanent.
- Official judging inputs are never silently removed.
affected_tasks:
- PD-F001-B02-T02
- PD-F001-B01-T03
artifacts:
- tests/integration/test_event_consequences.py
- src/api/eventconfig/consequences.py
resolution: |
  Decision: option A. The endpoints now return HTTP 400 with the reason (the preview and the endpoint share one answer), the consequences dialog states it, and the audit of every successful delete records what went with it. Nothing about rubric immutability changed. Owner may revisit with option B.
