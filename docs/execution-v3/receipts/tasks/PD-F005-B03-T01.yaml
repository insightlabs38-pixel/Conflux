deliverables:
- item: Per-user column preferences as a complete workflow
  result: pass
  evidence: the column picker's choice is remembered per person, workspace and list (columnPreference / setColumnPreference in shellPreferences, key columns:<entity>), restored on the next visit, undone by Reset columns, and stated in words in the picker (remembered on this device). Precedence is fixed - an open saved view's columns, then the person's choice, then the list's defaults - and a view's columns never overwrite the choice
- item: Degraded and edge states
  result: pass
  evidence: blocked storage remembers nothing and the list still works; a stored key the list no longer has is dropped and, if none remain, the defaults show (never an empty table); signed-out sessions store nothing; sign-out clears it with the other shell preferences
invariants:
- item: One preference store, no second source of truth
  result: pass
  evidence: spec 005 forbids a second preference store; the value goes through shellPreferences with the same validation (id-like keys, bounded length) as pins and recents. The server still decides which fields exist and which a person may read - the stored keys are only a request filtered by the catalogue
