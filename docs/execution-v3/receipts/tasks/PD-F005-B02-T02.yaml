deliverables:
- item: Recent organizer actions and recent objects as a complete workflow
  result: pass
  evidence: opening the palette shows the organizer's own latest eight audit actions in a Recent actions group (the action in words and how long ago), filtered by what is typed, and choosing one opens Operations and audit where the log is kept; the saved views the person opened lately (the view bar remembers each selection) are offered in a Recent views group, resolved against the server's lists so a deleted or hidden view is not shown, and a view that is pinned is shown once, under Pinned views. Events were already recents in the switcher. A record route does not exist, so a record cannot be a recent object yet.
- item: Through the canonical service layer, with the server change stated
  result: pass
  evidence: the actions are rows of the existing audit log. The one server change is additive and read-only - GET /audit/{workspace}/ accepts mine (only the caller's actions) and limit (1 to 200, newest first), refuses a bad limit with a field error, keeps organizer and admin only, and answers exactly as before without them (tests/integration/test_audit_recent_actions.py, 4 tests). OpenAPI and both SDKs were regenerated and their checks pass. This reclassifies the api surface for this task, recorded in the spec's PD-F005-B02 canonical contract.
- item: Authorization, states, keyboard, accessibility
  result: pass
  evidence: a role that may not read the log (a judge, a participant) asks nothing of it (unit and browser tests) and sees no group; the items are palette options with the keyboard behaviour of every command; the figure is relative time with the exact action text; nothing is written by the shell
