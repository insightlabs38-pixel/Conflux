findings:
- Spec 002 had no B03 contract, so the design (context as request data, surfaces, one endpoint, adopter, forbidden list) was written into the spec first, as for B02; no escalation condition applied because no second source of truth or migration was needed
- The existing form-builder preview shows unsaved edits and decides visibility in the browser; it is kept as the live editor preview and the server-resolved saved-form preview sits beside it rather than replacing it
limitations:
- Only forms are previewable; rubric and page surfaces are not registered yet
- The preview does not persist in the URL, so it cannot be shared as a link
- The saved-form preview shows fields and conditions, it does not evaluate answers
