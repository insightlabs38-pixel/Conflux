deliverables:
- item: Contextual side inspector that preserves list position, as a complete workflow
  result: pass
  evidence: every entity list (the QUERY consumer, EntityGrid) has a labelled Details button per row. It opens the record in an Inspector beside the list - docked from 1024px (22rem), a full-height sheet with a scrim below it (design D-009) - showing every field of the entity (the same page read again with all columns, the server still deciding what is visible), the record's name as its heading (focus lands on it), Previous and Next with the position (3 of 25), and a close button. The list is not remounted, so its scroll position, page, filter and selection survive; the open record is marked in the list (aria-current) and stays in view. The record is panel state in the URL (row_<entity>, a public id, replaced so Back leaves the page), so a link reopens it; one that is not on the current page says so. Escape closes it and focus returns to the row's Details button.
- item: Reuses the canonical primitives
  result: pass
  evidence: QUERY (the entity page and catalogue), DATA_GRID (a highlightedId prop and a data-row-id on rows) and the URL-state rules (useUrlParam) are used as they are; the field formatting is the grid's own; no new endpoint, model or list plumbing
- item: States, keyboard, accessibility
  result: pass
  evidence: complementary region labelled by its heading; the stepper is real buttons; a failed full-field read shows Try again and keeps the list's own values; axe passes with the inspector open at 1440, 1100, 800 and 390; no hidden menus (V-SLOP-8)
