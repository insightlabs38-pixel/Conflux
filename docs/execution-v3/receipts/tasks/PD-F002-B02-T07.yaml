findings:
- The browser spec first matched the workspace audit log list instead of the configuration history and hit an axe target-size violation on the new summaries; both fixed (scoped selector, minimum summary height)
- The contract's inputs digest has little use for an export (the file itself is the checkable thing), so the exact file's digest is recorded as an output block and inputs.digest stays opt-in
limitations:
- Only the archive export and configuration restore record an envelope; other job kinds and audit actions do not yet
- There is no server endpoint for verifying a file; verification is offline or in the browser by design
