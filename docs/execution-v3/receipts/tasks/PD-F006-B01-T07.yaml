limitations:
- Offset paging counts the whole result on every page; at 5,016 rows that is 31 to 43 ms. A dataset several hundred times larger would call for keyset paging, which is a contract change to raise then, not now.
- The measurement is one machine and one run set, not a benchmark; the pytest guard checks shape, not speed.
