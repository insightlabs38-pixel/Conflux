findings:
- "P2 (ESC-20260930-003, default A applied): deleting a draft event or a stage with a published rubric returned HTTP 500; since presets publish a rubric, preset events cannot be deleted at all. Now a clear 400; whether to allow deleting an unused rubric is an owner decision"
- Not every destructive operation in the product is covered; template, page-block, invite, webhook and mentorship deletes, stage advancement and award publication still act without the dialog (limitation)
- Track and prize deletion are covered by the API preview only; the workspace UI has no control for them
- A scratch screenshot run accidentally created an event on seed 7 and failed the read-only tier once (35 failures, every spec reading the demo event); seed 7 was restored with scripts/demo-reset and the full make e2e-fast then passed
limitations:
- The preview describes the state at the time it is read; the endpoint re-validates, so a race shows the endpoint's refusal in the dialog
- Labels of removed records come from model names (for example stage link); unusual cascades fall back to the model's verbose name
