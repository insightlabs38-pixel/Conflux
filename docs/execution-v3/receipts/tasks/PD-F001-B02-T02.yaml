deliverables:
- item: Destructive and high-impact operations show consequences instead of a generic confirmation
  result: pass
  evidence: GET consequences answers for event open, close, archive, delete, stage delete, link delete, track delete and prize delete; the web ConsequenceDialog (status button, stage and link deletes) lists what would happen, says when it cannot be undone, and names its button for the operation
- item: Consequences come from the domain, not from the UI
  result: pass
  evidence: deletes use Django's deletion collector (removed, unlinked, protected), status changes use the same validation and readiness the endpoint uses, a link preview runs the whole-graph validation on a rolled-back removal; tests compare every preview with what the real endpoint then does
- item: Refusals are explained and consistent
  result: pass
  evidence: a refused operation returns the same reason from the preview and the endpoint (HTTP 400), and the dialog offers only Close; a stage or draft event with a published rubric used to fail with an unhandled error (HTTP 500) and is now refused with the reason (ESC-20260930-003)
- item: Audit
  result: pass
  evidence: event, stage, link, track and prize deletes record the consequences (code and count) in the audit metadata; the open transition keeps recording the unresolved readiness items (test compares it with the preview)
- item: States and accessibility
  result: pass
  evidence: loading, failed check with Try again, refused, allowed, failed operation keeps the dialog open; modal with focus moved in, kept in and returned, Escape and Cancel change nothing (ConsequenceDialog.test); browser spec at 390 and 1440 with axe and no overflow
invariants:
- item: Server authorization, validation and audit remain authoritative
  result: pass
  evidence: the preview is read-only, organizer/admin only (judge 403, anonymous denied, cross-workspace 404); the operation endpoints still validate and audit
- item: One source of truth
  result: pass
  evidence: STATUS_FLOW is shared by the status endpoint and the preview; refusals are computed once
