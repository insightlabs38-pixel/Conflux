[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "conflux-sdk"
version = "0.1.0"
requires-python = ">=3.12"
description = "Generated OpenAPI client for Conflux"
readme = "README.md"

[project.scripts]
conflux-admin = "conflux_sdk.cli:main"

[tool.setuptools.packages.find]
include = ["conflux_sdk*"]
