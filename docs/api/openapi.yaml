  /api/v1/events/{event_public_id}/search/:
    get:
      operationId: get_api_v1_events_event_public_id_search
      parameters:
      - in: query
        name: artifact_kind
        schema:
          type: string
          enum:
          - dataset
          - document
          - external_video
          - file
          - image
          - live_url
          - repository
          - secret
          - video
      - in: path
        name: event_public_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: offset
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: stage
        schema:
          type: string
      - in: query
        name: tags
        schema:
          type: array
          items:
            type: string
      - in: query
        name: track
        schema:
          type: string
      tags:
      - events
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
