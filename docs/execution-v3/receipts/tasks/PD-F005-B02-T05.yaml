deliverables:
- item: Preview as participant, judge or public as a complete workflow
  result: pass
  evidence: organizers and admins get a Preview as section in the account menu and three palette commands. The dialog asks the server, through the PREVIEW_CONTEXT primitive (POST preview-as), for the event's saved application form as that role meets it - the fields shown, their types and whether required, how many are not shown, and the server's own sentence naming who and what - and, for the public, the public page drawn in an iframe whose sandbox forbids scripts, forms and navigation. The role can be changed inside the dialog; Escape closes it.
- item: Without unsafe impersonation
  result: pass
  evidence: a context is request data in one body, never an identity, a header, a cookie or a stored row (core/preview_context.py); the caller stays the actor, so a preview only shows a subset of what they could already read. The dialog says so in words (Nothing is saved or sent, you are still signed in as you with your own permissions) and the browser test checks the session still gets 200 from an organizer endpoint after previewing; no role is granted or assumed, nothing is written
- item: States, keyboard, accessibility
  result: pass
  evidence: no event chosen (asks to choose one), loading, no forms, a form with nothing published (the server's sentence), and a retry; a modal dialog with focus return and a role radio group; axe passes at 1440 and 390 with it open; a judge or participant is shown no preview control (unit and browser tests)
