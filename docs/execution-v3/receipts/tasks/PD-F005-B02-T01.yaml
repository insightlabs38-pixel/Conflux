deliverables:
- item: Event state indicator, always available but unobtrusive, through the canonical domain layer
  result: pass
  evidence: events/lifecycle.py derives the phase once on the server from what is stored - archived and draft are what they say, a published award means published, a submitted non-calibration ballot means judging, otherwise closed or open - with no clock and no client input, and the word, a key and a sentence of reason are sent as an additive read-only phase on the organizer events list (EventSerializer), the judge events list and the participant events list. The event switcher shows the phase as a quiet icon-and-word status beside the selected event's name in the top bar and beside each event in the list, with the reason as its tooltip and in the control's accessible name; it is on every role's shell and nothing else changed in the header.
- item: Observable state and diagnostics
  result: pass
  evidence: the reason sentence says why (for example Judging has started - ballots have been submitted); the API and the screen say the same thing because both read the one function; closing the event changes the word on the next read (browser test)
- item: Integrates with authorization, audit and versioning
  result: pass
  evidence: read-only on the three lists, which keep their own authorization (the participant list still excludes drafts and archived events); changing the status still goes through the status endpoint, its consequences and its audit, none of which changed; a PATCH that tries to set the phase leaves it derived (tested); OpenAPI and both SDKs regenerated and checked
