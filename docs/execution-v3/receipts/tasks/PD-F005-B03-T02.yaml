deliverables:
- item: Workspace-aware tabs that preserve unsaved drafts
  result: pass
  evidence: a form adopts useDraft(scope, initial, label) in place of useState and its edits live in a shell-owned in-memory store (lib/drafts.ts) keyed by workspace and scope, so going to another place and back finds them as left. WorkspaceTabs shows the places the person kept open (palette Keep this place open / Close this place's tab) plus any place holding a draft, each marked with a dot and the words unsaved changes, each reopening where that place was left. The event appearance form (ThemeSettings) is the first adopter, as a real organizer workflow
- item: Losing work is always a question
  result: pass
  evidence: closing a tab with a draft opens a dialog naming the draft and what discarding does; signing out with drafts asks first (DraftGuard) and discards only on yes; while any draft exists a reload or closing the browser tab triggers the browser's own warning; clearShellPreferences at sign-out also discards drafts
