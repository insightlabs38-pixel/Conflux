- item: Canonical event timeline/scheduling primitive
  result: pass
  evidence: derived and stateless; provider and rule registries in core/timeline.py, one endpoint GET events/{e}/timeline/ with from, to, kinds and limit; seven providers (event dates, gates, publication, agenda, office hours, voting, pending reminders) registered from the eventconfig app that already knows these domains
- item: Stable inputs/outputs, ordering, authorization, error shape, extension boundary
  result: pass
  evidence: docs/operations/TIMELINE.md; items ordered by start, kind, key with stable keys; instants in UTC plus the event zone with offset and a daylight-saving note; organizer or admin only; bad range, kinds and limit are 400 with the reason; a provider only reads, caps its rows and may name a domain write
- item: Deterministic advisory conflicts
  result: pass
  evidence: window_inverted, location, track and mentor overlap (touching ends are not an overlap), outside_event, publication_before_voting_closes; no clock or heuristic; judged on the whole event, shown when they touch the answer; never block anything
- item: Changing a time goes through the existing domain write
  result: pass
  evidence: every item carries write {method, path, fields, extra}; test_every_editable_item_changes_through_its_own_domain_endpoint applies the documented write for event, gate, agenda, voting and publication and sees each move by exactly the shift; the web sends changes there and shows the domain's own refusal
