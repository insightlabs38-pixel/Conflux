deliverables:
- item: Global command palette as a complete workflow
  result: pass
  evidence: Ctrl+K or Cmd+K from anywhere in the workspace (and the header button) opens one overlay of commands and record search; the same keys or Escape close it and focus goes back to where it was. With nothing typed it lists the person's recent commands first, then Go to, Events, Appearance and Account; typing ranks them (exact, prefix, word prefix, every typed word, substring, subsequence); arrow keys move (wrapping), Enter runs, the list is a labelled combobox and listbox with aria-activedescendant. Commands go to a place, switch event, set the theme, open notification preferences and sign out - through routes.target, shellPreferences and the existing sign-out; record hits from T06 sit below them.
- item: One canonical registry, the primitive COMMANDS (ESC-20260930-007 option A)
  result: pass
  evidence: src/web/lib/commands.ts is the only registry - Command {id, label, group, keywords, shortcut, when, run}, providers that contribute commands for the context, deterministic ranking with the person's recent commands as the tie-break; src/web/lib/shellCommands.ts registers the shell's providers. The shortcut overlay (B02-T07) and selection-parameterised commands (B03-T04) read this registry; PD-F071-B02-T01 is to formalise this module, not create another.
- item: States, keyboard, accessibility
  result: pass
  evidence: no match, searching, one entity that could not be searched, no event chosen, two-character minimum for records; a role lacks the commands it has no place for (a participant is not offered Go to Event setup, checked in the browser and the unit tests); at 390 the dialog sits inside the viewport; axe passes with the palette open; the header hint shows Ctrl K or the Cmd glyph and is hidden on a phone
