deliverables:
- item: Role switcher for people with several roles, with a clear viewing-as state, as a complete workflow
  result: pass
  evidence: the account API already returns one membership per role, but the app showed whichever came first. Now lib/roles.ts lists the roles a person holds in the workspace (most privileged first) and pickRole chooses - the role asked for by the as URL context param when the person holds it, otherwise the most privileged. The header says Workspace, viewing as, role whenever the person holds more than one role; the account menu has a Viewing as section of links (one per role, the current marked, each a history entry that goes to that role's overview and keeps the event); the palette has View as commands; as is carried between views, by the event switcher and by search hits (navigation.target keeps the event and the role).
- item: A choice of screen, never a permission
  result: pass
  evidence: nothing is sent to the server for the choice and no role is granted; the browser test views as participant while the same session still gets 200 from an organizer endpoint, and a role the person does not hold is dropped from the URL by a replace instead of shown (also unit-tested in App.roles.test.tsx); the server authorizes every request against the roles really held
- item: Robust to hand-edited URLs
  result: pass
  evidence: carriedContext keeps only id-like values, so a hostile event or as value in the URL is dropped from links instead of throwing in routes.target (this also closes a regression risk from T01 in the navigation links, now tested)
invariants:
- item: One route builder; one carried-context rule
  result: pass
  evidence: navigation.target and navigation.href both build through routes.target with carriedContext; the switcher, palette and search no longer call routes.target directly
- item: No test weakened
  result: pass
  evidence: tests were added; the two existing expectations that count context params are unchanged because as is absent unless asked for
