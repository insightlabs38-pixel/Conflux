findings:
- P2 judging and published are not stored statuses; derived server-side as decided in QUESTIONS.md (2026-10-08T00:30Z); closed is kept as a sixth word because it is a real stored state.
- P3 the reuse of the APPROVAL primitive named by the task is not exercised: the indicator does not show a pending approval, because no event status change is approval-gated today.
- P3 each phase read costs two small existence queries per event; the lists are short, and a bulk annotation can replace them if lists grow.
escalations: []
limitations:
- Judging is read from submitted ballots, not from a judging window; an event whose judging is scheduled but not started reads as open or closed.
- Published means at least one award is published; a results page published without awards would not show.
