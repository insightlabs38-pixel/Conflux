  /api/v1/judge/scores/:
    get:
      operationId: get_api_v1_judge_scores
      description: |-
        T2: a judge reads their own scores by default; `?judge=<id>` lets an
        organizer (or the judge themself) look up a specific judge, and refuses
        anyone else — the backend check the checker's peer_scores probe is for.
      tags:
      - judge
      security:
      - sessionCookie: []
      - scopedBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JudgeScoreSchema'
          description: ''
  /api/v1/public/events/{event_public_id}/voting/candidates/:
    get:
      operationId: get_api_v1_public_events_event_public_id_voting_candidates
      description: |-
        Community voting is deliberately open to non-workspace-members under
        email_link/token identity modes -- an audience choice award isn't
        limited to people with a platform account, and in particular has no
        reason to know the event's workspace id, so `get_event` resolves purely
        by Event.public_id (globally unique) and these routes are reachable
        both workspace-nested (community.urls' original shape) and under the
        workspace-free `public/events/<event>/...` prefix a shared voting link
        would actually use. Authenticated-mode casting still requires a real
        session (checked inline, not via permission classes, since the same
        view serves all three identity modes).
      parameters:
      - in: path
        name: event_public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - public
      security:
      - sessionCookie: []
      - scopedBearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CandidateSchema'
          description: ''
  /api/v1/public/events/{event_public_id}/voting/request-email-token/:
