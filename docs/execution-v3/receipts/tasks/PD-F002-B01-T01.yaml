deliverables:
- item: Canonical query/filter AST as a reusable platform primitive, not a feature-local helper
  result: pass
  evidence: core.entities (registry of entities and typed fields), core.query (versioned JSON filter tree with and, or, not and typed operators, sort, columns, paging), generic endpoints for the catalogue and for a page of any registered entity; domains register from their own entities module and core never imports them
- item: Stable inputs, outputs, state ownership, lifecycle, authorization, idempotency, error shape and extension boundary
  result: pass
  evidence: stateless and read-only (so idempotent); authorization decided in the registration (roles plus a base queryset per event and user); errors are 400 keyed by the path of the offending part (filter.and[1].op, sort, columns, limit, offset), 404 unknown entity, 403 wrong role, 404 foreign event; docs/api/ENTITY_QUERY.md
- item: Reference consumers demonstrating reuse without private coupling
  result: pass
  evidence: "two independent apps register entities (events: applications, projects app: projects) and one conformance test proves every registered field filters and sorts against the database; the web lib and FilterBuilder consume only the catalogue response"
- item: Compatibility and migration expectations documented
  result: pass
  evidence: no schema change; existing list endpoints and parameters are unchanged (test_the_legacy_applications_endpoint_is_unchanged); ENTITY_QUERY.md and spec 002 record adoption
invariants:
- item: Server authorization and validation authoritative
  result: pass
  evidence: only registered fields and operators compile; no lookup string, relation traversal or SQL comes from the client; values are parameterized (a hostile text value and a percent sign are literals); complexity is bounded (depth 4, 20 conditions, 50 values, 200 characters, 3 sort keys, 100 rows); judges, anonymous users and other workspaces are refused
- item: No duplicate source of truth
  result: pass
  evidence: one registry and one compiler; the client only builds and sends the tree
