source_record: exports/r2.1/SOURCE.md
resolved_in_r2_1:
  - "Outlined-button border: line-3 in light and dark; ghost/text borderless; hairlines unchanged; no toolbar variant needed (D-008)"
  - "Density: Standard default; Dense explicit, suggested on ~1800px+ displays; never auto-switched by viewport (D-009)"
  - "Public Dark base preset: kept as optional organizer-selectable preset, independent of the app theme; no extra board set (D-008)"
  - "Pairwise tie-share cap default and strength-of-preference moved to the judging/product spec; UI parameterised (D-010)"
open_questions: decisions/007-open-questions.md   # non-blocking only: brand mark, font hosting, wallet scope, immersive hero, co-editing, RTL
changed_in_r2_1:
  - "Figure 2 'Error by horizon' placeholders -> real inline chart 'Forecast MAE by horizon' (Story-Editor, Story-Rich, Story-History diff, Judge-Review, Judge-Mobile, Dark-Judge, Resp-768, Pairwise-Narrow, Public-Project, Public-Project-Mobile); failed-media specimen only in States-1"
  - "Public-Project Figure 1 -> compact real architecture diagram (desktop + mobile)"
  - "Data-Surface / Dark-Organizer: stray ellipsis fragment at inspector edge removed; row hairlines reach the inspector; Changed column 96px"
  - "Outlined buttons line-3 (v3.css, all boards)"
  - "Revision labels: Sys-Foundations, Sys-Components, Sys-Dark, Sys-Directions, States-1, States-2, Main"
  - "Whitespace/fixture: Shell-Mobile, Public-Event-Themed, Public-Event-Mobile, Public-Project(-Mobile) artboard heights"
  - "Small defects: Deliberation note-input icon, Sys-Foundations spacing labels and info glyph, Pairwise-Narrow bar heights"
known_limitations_global: "Static comps; illustrative content (figure CI bands are illustrative); Google Fonts in prototypes (system fallbacks render if blocked; self-host in production); hover/focus/animation and axe runs belong to implementation QA."
deferred:
  - final logo/brand mark (placeholder C mark)
  - immersive hero beyond its Advanced entry point
  - full wallet-pass internals
  - live collaborative cursors / co-editing
  - exhaustive RTL and localization
  - later Product Depth v3 surfaces (see LATER_DESIGN_PASSES.md)
