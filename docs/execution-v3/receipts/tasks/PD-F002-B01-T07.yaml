findings:
- The first browser run found that Escape did not close a dialog after the focused confirmation button had been removed (focus fell to the body); Modal now listens for Escape on the document
- The typed serializer coerces a number to text, so the type-error test sends a list
- An attempted focus-regain handler could not be proved in the test DOM, so it was removed rather than kept untested
limitations:
- No note count or indicator in the grids; the Notes button always opens the thread
- Mentions are @username text with chips for people already in the thread, no people picker
- The public audience is a rule for workspace members; there is no signed-out thread surface
- Threads are excluded from the event archive and have no attachments, reactions or edit history
