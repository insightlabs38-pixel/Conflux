findings:
- "Fixed: a person:<field>=erased|purged claim was backed by any erased or purged bucket of the model, so a different user column could claim it; it now needs a bucket the service finds rows by that column (read from the query it builds for a stub person)"
- "Fixed: the counter lock was a substring match on the idempotency refs and ignored the claim state; it is now an exact locked@<model>.<field> mode of a provided claim"
- "Fixed: an in_place@ claim skipped the check for a comparison source the manifest provides (diff_exists); a hook of a manifest that declares several features was only caught by a test and is now reported on the first of them (hook_unclaimed)"
- "Fixed: the bulk-write guard was a one-line regex; it is an AST scan of update, delete and bulk_update calls whose receiver is built from a version model or its parent's related manager (a queryset held in a variable is still not followed, stated in the docs)"
- "Fixed: the fixtures verifier's docstring overstated what the running check proves and its broad except hid generator bugs; it now narrows to ValidationError and says the proof ties the feature to the rows; the browser spec no longer selects cells by position"
- "Reversed: the organizer role-navigation budget (20 s + 5 s per destination) was reverted to the fixed 30 s because AGENTS.md forbids hiding regressions behind timeouts; the flake is recorded in QUESTIONS.md for the owner and the clean rerun is the evidence"
- "Answered, not changed: marking the seven batch tasks DONE is authorized by the continuous single-agent prompt (section 12: the agent owns selection and execution and may update runtime state when the evidence supports it); the repeated checks of the five verifiers (test-ref regex, reason length, claimed-elsewhere loop) are a refactor over fifteen modules, recorded as a follow-up; announcement counter stale-writer is proved with the other locked changes by the idempotency suite and the wording now says so"
limitations:
- "the review is by the same tooling account and model family, so it is not independent of the author (QUESTIONS.md, default A); an owner can still commission a human or second-model review before release"
- "immutability of version models is a rule of the model, not the database, and the AST scan does not follow a queryset held in a variable (QUESTIONS.md, default A)"
