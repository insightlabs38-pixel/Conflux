findings:
- The existing overview tests stub every request with empty answers, which crashed the new panel until it degraded a malformed answer to an empty timeline; the panel is now tolerant
- The publication endpoint rejects unknown fields, so the write descriptor gained an extra map (the stage of a finalists schedule) instead of a whole-body mode
- Community voting stands in for the judging window because judging has no dates
limitations:
