[project]
name = "conflux"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "celery>=5.5,<5.6",
  "psycopg[binary]>=3.2,<3.3",
  "dj-database-url>=3.0,<4",
  "uvicorn>=0.37,<0.55",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-django>=4.11,<5",
  "ruff>=0.13,<0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src/api"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/api/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
