[conflux]
version = 1

[portal]
base_url = "http://localhost:8080"

[tiers]
# The organizer checker automates T1/T2 only; T3/T4 are manually judged.
# Conflux-owned regression/evidence: make verify-dogfood-extended.
claimed = ["T1", "T2", "T3", "T4"]
pitch = "Self-hostable hackathon operations from submissions to awards: isolated weighted and Bradley–Terry judging, normalization and replay evidence, community voting and abuse controls, signed records, webhooks, hybrid event workspaces, and portable archives — with OpenAPI, SDKs, CLI and MCP, and offline-capable Compose deployment."

[routes]
gallery = "/api/v1/gallery/"
submit = "/api/v1/submit/"
judge_scores = "/api/v1/judge/scores/"
# judge_a is linked (by `link_judge_identities`) to fixture judge jdg_01;
# this is the url that, in this portal, returns judge_a's scores.
peer_scores = "/api/v1/judge/scores/?judge=jdg_01"
csv_export = "/api/v1/export.csv"

[auth]
# Whatever header proves you are this role; the checker never logs in, it
# just attaches these. Values must match the fixed tokens issued by
# `manage.py seed_acceptance_identities` (src/api/accounts) — see
# tests/acceptance/test_acceptance_auth_config.py for the regression that
# keeps this file and that command from drifting apart.
organizer = "Cookie: session=acceptance-organizer"
judge_a = "Cookie: session=acceptance-judge-a"
judge_b = "Cookie: session=acceptance-judge-b"
participant = "Cookie: session=acceptance-participant"
