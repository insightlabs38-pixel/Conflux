deliverables:
- item: Layouts offered only where semantically valid
  result: pass
  evidence: 'The entity registration names board_field (a groupable field) and calendar_fields (filterable
    dates); Entity.layouts() derives list always, board, matrix (two groupable fields) and calendar, the
    catalogue publishes layouts, board_field and calendar_fields, and a layout the list does not offer
    is refused by name. Applications: board by status, calendar by created or decided; projects: board
    by track, calendar by created; both offer a matrix'
- item: Board, matrix and calendar through the one query
  result: pass
  evidence: Board = group buckets with counts, one ordinary query per column with the bucket as a condition
    (an enum shows every value, empty ones too); matrix = group x subgroup counts as a table with totals,
    a cell opens its rows with two conditions; calendar = new calendar and month parameters answering
    per-UTC-day counts for the same filter and search, a day opens through two ordinary conditions. query.answer
    is now the single response builder for the route and for a saved view's run
- item: Saved views keep the layout
  result: pass
  evidence: layout and calendar are additive optional keys stored only when not the list; a matrix needs
    group and subgroup, a board no subgroup, a calendar no group (path-keyed refusals); a view runs a
    board from the entity board field when it names no group and a calendar for the month asked; older
    views are byte-identical
- item: Record by id for the inspector
  result: pass
  evidence: GET entities/{key}/{row_id}/ returns every registered field under the same base queryset and
    roles as the list; the inspector now opens from a card, a matrix row, a group, a calendar day or another
    page; the page-sized second query it replaced is gone
- item: Web
  result: pass
  evidence: Layout switch above the list (only when more than one layout), Columns by / Rows and Columns
    / Date selectors, layout and params in the address, loading and error states per layout, stale data
    of another layout never shown; Previous month, Next month, This month
- item: CLI and MCP
  result: pass
  evidence: entities query --calendar --month and the query_entity calendar and month parameters call
    the same route; layout itself is presentation and needs no parameter
invariants:
