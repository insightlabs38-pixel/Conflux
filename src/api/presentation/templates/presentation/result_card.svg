<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">{{ title }}</title>
  <desc id="description">{{ event_name }} — published result</desc>
  <rect width="1200" height="630" fill="#f6f7f9"/>
  <rect x="32" y="32" width="1136" height="566" rx="20" fill="#ffffff" stroke="#d7dce2"/>
  <rect x="32" y="32" width="12" height="566" rx="6" fill="#2952cc"/>
  <g font-family="Arial, sans-serif">
    {% for line in event_lines %}<text x="80" y="{{ line.y }}" font-size="26" fill="#56626d">{{ line.text }}</text>{% endfor %}
    {% for line in title_lines %}<text x="80" y="{{ line.y }}" font-size="62" font-weight="700" fill="#16202b">{{ line.text }}</text>{% endfor %}
    {% for line in subtitle_lines %}<text x="80" y="{{ line.y }}" font-size="28" fill="#2952cc">{{ line.text }}</text>{% endfor %}
    <text x="80" y="568" font-size="20" fill="#56626d">Conflux · Published results</text>
  </g>
</svg>
