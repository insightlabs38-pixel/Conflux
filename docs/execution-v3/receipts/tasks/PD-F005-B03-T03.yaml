deliverables:
- item: Multi-pane operations mode for large desktop displays
  result: pass
  evidence: a device choice (account menu Operations mode, palette Turn on/off operations mode), off by default. From 1800px wide the workspace gains a 26rem pane beside the page (rail, page, pane; tabs span page and pane); it watches what needs attention (the readiness list, ReadinessPanel as the Setup page uses it), the person's own recent actions (audit log) or the inbox, chosen in the pane, with the live health line of T05 and refreshes on the 15 s live topic. Below 1800px it is not rendered at all (no hidden fetching) and returns when the display widens
