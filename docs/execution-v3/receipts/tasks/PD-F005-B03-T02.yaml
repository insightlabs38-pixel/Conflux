limitations:
- Only the event appearance form uses useDraft so far; other forms keep plain useState until they adopt it (the hook is a drop-in for useState).
- Drafts do not survive a reload or sign-out by design (typed text is not stored); the browser warns first.
- Closing a kept tab from the palette never discards a draft; a place that still holds one stays in the strip until it is saved or discarded.
