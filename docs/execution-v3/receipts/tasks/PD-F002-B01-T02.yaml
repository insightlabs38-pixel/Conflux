deliverables:
- item: Saved views as a reusable platform primitive
  result: pass
  evidence: core.SavedView stores a named definition of filter tree, sort, columns and density per event, owner and entity with visibility private or organizers; CRUD and a run endpoint under events/{e}/views/; validated against the entity when saved
- item: Sharable view URLs
  result: pass
  evidence: the URL carries the view public id only (view param); inline filters were dropped from the contract because URL-state rules forbid free text and personal data in URLs (recorded in spec 002); a link to a view the caller cannot see falls back to the default list
- item: Authorization, lifecycle, idempotency and concurrency
  result: pass
  evidence: running always goes through the entity query under the viewer's rights; a view of an entity the caller may not query is absent (404) not forbidden; only the owner changes a view, owner or admin deletes; updates carry a version and a stale one is 409 view_changed; names are unique per owner and there is a quota of 50; a definition that no longer fits is 409 view_outdated and never loosened
- item: Audit
  result: pass
  evidence: saved_view.created, updated and deleted are audited with entity, name and visibility changes; filter values are never copied into the record (asserted with an email address in a filter)
- item: Web surface
  result: pass
  evidence: lib/savedViews.ts and ViewBar (pick with my and shared groups, changed-since-saved status, save with version, save as new, rename, share toggle, copy link, delete with the consequence stated, server refusal keeps the work, failed load with retry)
