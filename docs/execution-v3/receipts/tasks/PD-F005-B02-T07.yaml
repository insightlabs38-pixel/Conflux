deliverables:
- item: Keyboard shortcut help overlay as a complete workflow
  result: pass
  evidence: The question-mark key opens a dialog titled Keyboard shortcuts with what works anywhere (Ctrl or Cmd K, "/", Esc) and, per group, the commands that declare a shortcut - read from the command registry (COMMANDS, lib/commands.ts), so a command that declares one appears without editing the overlay; the go-to keys are G then a letter for each of the role's places (a key field on roleDestinations, unique per role). The same help opens from the palette (Show keyboard shortcuts) and from the account menu, which is how it is found with no keyboard.
- item: The shortcuts themselves
  result: pass
  evidence: lib/shortcuts.ts interprets keys apart from React - question mark for help, slash for the palette, g starts a chord that lasts 1.5 s and the next letter goes to that place; any other key drops it; nothing fires while typing (input, textarea, select, contenteditable), with Ctrl, Cmd or Alt held, or while a modal dialog is open
- item: Accessibility - single-key shortcuts can be turned off
  result: pass
  evidence: the help has a switch (checkbox) for single-key shortcuts (WCAG 2.1.4); off, "?", "/" and G-then-letter do nothing and the keys using Ctrl or Cmd remain; the choice is device-local (shellPreferences), survives a reload and is forgotten at sign-out; the overlay is a modal dialog with focus return and passes axe at 1440 and 390
