          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailTokenInputSchema'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailTokenInputSchema'
        required: true
      security:
      - sessionCookie: []
      - scopedBearer: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTokenReceiptSchema'
          description: ''
