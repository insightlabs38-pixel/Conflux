findings:
- P2 the shell-level meaning of preview as was ambiguous (whole-app impersonation or a server-evaluated preview); decided as the latter and logged for the owner in QUESTIONS.md.
- P3 only two surfaces are registered with PREVIEW_CONTEXT (form, page); a judge's rubric or a participant's own screens cannot be previewed until they register.
escalations: []
limitations:
- The preview shows the form's field list, not a rendered form; the public page preview is the saved page, not unsaved edits (the page builder has its own live preview).
- It previews the first form unless the event has several, then a selector appears; there is no cross-surface "walk the participant's whole journey".
