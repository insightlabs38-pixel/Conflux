findings:
- Deliberate semantics change - dashboard configuration_checks no longer asks for a track and a base prize on every event (presets start without them by design); it reports only the rules it always did that still apply (dates, and tracks when a rule requires one). The stale src/api/events/test_events.py that asserted the old counts is not collected by the suite (testpaths is tests) and already fails before this change (404 URL prefix)
- T04 follow-up fixed here - overview cards for Eligibility workload and On-site readiness are hidden while those modules are off (they linked to destinations that are not offered)
- "P2 pre-existing defect found: GET voting-plan creates a VotingPlan as a side effect, and the hidden CommunityVotingBuilder mounts for every selected event, so merely viewing an event makes community voting look in use and adds a voting_window warning. Not fixed in the API (contract change); T02 gates the builder on the module being on, which removes the trigger from the base experience"
- Browser spec asserts no blockers remain and judging_pools is open rather than an exact list, because of the voting-plan side effect above until T02
