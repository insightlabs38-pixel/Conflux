[project]
name = "conflux"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "celery>=5.5,<5.6",
  "psycopg[binary]>=3.2,<3.3",
  "dj-database-url>=3.0,<4",
  "uvicorn>=0.37,<0.55",
  "redis>=5.0,<6",
  "boto3>=1.40,<2",
  "drf-spectacular>=0.28,<0.30",
  "cryptography>=50.0.1",
  "pyjwt>=2.15.0",
  "markdown-it-py>=4,<5",
  "pygments>=2.21,<3",
  "segno>=1.6.6",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-django>=4.11,<5",
  "pytest-xdist>=3.8.0",
  "ruff>=0.13,<0.14",
  "PyYAML>=6,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src/api"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/api/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
