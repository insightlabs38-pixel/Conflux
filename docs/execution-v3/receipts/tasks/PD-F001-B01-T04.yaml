findings:
- Census correction - the T00 log undercounted eligibility review (rules-row probe); with the real probes it is in use on 6 of 9 events. Spec 001 and a T04 census log record it
- The Projects and eligibility destination also hosts deadline-exception decisions, so a deadline exception request counts as eligibility-module content (otherwise requests would be unreachable)
- Browser specs changed deliberately, not weakened - workspace-shell no longer expects Integrations on an event that does not use it and asserts it is hidden with a working deep link; the integrations tour moved to event-modules.spec.ts which turns it on through the UI
- Webhook subscriptions cannot be deleted, so a subscription (even disabled) keeps Integrations on for that event
limitations:
- Only organizer/admin navigation is module-aware; participant, judge, mentor and volunteer lists are unchanged
- Panel-level modules (community voting, mentorship, deliberation, public page) are listed and toggleable but their panels collapse in T02
- Until the first module response arrives every destination shows, then hidden ones disappear (one request per workspace open; the last answer is kept across event changes)
- Without a selected event the workspace union applies
