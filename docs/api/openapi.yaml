openapi: 3.0.3
info:
  title: Conflux API
  version: 1.0.0
paths:
  /api/v1/accounts/login/:
    post:
      operationId: post_api_v1_accounts_login
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInputSchema'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginInputSchema'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginInputSchema'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseSchema'
          description: ''
  /api/v1/accounts/logout/:
    post:
      operationId: post_api_v1_accounts_logout
      tags:
      - accounts
      security:
      - sessionCookie: []
      - scopedBearer: []
      responses:
        '204':
          description: No response body
  /api/v1/accounts/me/:
    get:
      operationId: get_api_v1_accounts_me
      tags:
      - accounts
      security:
      - sessionCookie: []
      - scopedBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummarySchema'
          description: ''
  /api/v1/audit/{workspace_public_id}/:
    get:
      operationId: get_api_v1_audit_workspace_public_id
      description: |-
        Resolves `self.get_workspace()` from a `workspace_public_id` URL kwarg
        before permission checks run, so `HasWorkspaceRole`/`IsWorkspaceMember`
        can evaluate role membership against the right tenant. Shared by every
        app with workspace-scoped endpoints (workspaces, audit, and later
        event/stage/policy views) to keep the lookup identical everywhere.
      parameters:
      - in: path
        name: workspace_public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - audit
      security:
      - sessionCookie: []
      - scopedBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEventSchema'
          description: ''
  /api/v1/audit/{workspace_public_id}/events/{event_public_id}/config-history/:
    get:
      operationId: get_api_v1_audit_workspace_public_id_events_event_public_id_config_history
      description: |-
        Readable event/stage/policy/rubric configuration history (S18):
        only audit rows that actually captured a field-level diff, newest
        first. Rows written before this batch have an action name but no
        `changes` in their metadata -- those are omitted rather than shown
        with an invented or missing diff.
      parameters:
      - in: path
        name: event_public_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - audit
      security:
      - sessionCookie: []
      - scopedBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfigHistoryEntrySchema'
          description: ''
  /api/v1/audit/{workspace_public_id}/events/{event_public_id}/config-history/{audit_event_public_id}/restore/:
    post:
      operationId: post_api_v1_audit_workspace_public_id_events_event_public_id_config_history_audit_event_public_id_restore
      parameters:
      - in: path
        name: audit_event_public_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: event_public_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
