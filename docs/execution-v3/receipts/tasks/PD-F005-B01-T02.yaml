deliverables:
- item: Event/workspace switcher with recent and favorite events, as a complete workflow
  result: pass
  evidence: a top-bar control (EventSwitcher) on every role shell shows the selected event and opens a panel with Favorites, Recent, the other events and, for people with more than one membership, Workspaces. Choosing an event links to the same view through routes.target with the event param (a history entry; stage, plan and invite are dropped), a star toggles a favorite (aria-pressed, 12 at most, refused with the list unchanged beyond that), and a recent is recorded when an event is chosen (8 at most, newest first, once each).
- item: Wired to canonical state, no mock
  result: pass
  evidence: the lists are the ones each role already uses (events, judge-events, participant-events), so the server decides what a person may see; the selected event is the URL's event param validated against that list; a stored favorite or recent that is no longer listed is not shown; browser tests run on the live seeded stack for organizer, participant and judge
- item: States, keyboard, accessibility, base clutter
  result: pass
  evidence: loading ("Loading events…"), none ("No events", panel text), error with Try again, nothing selected ("Choose an event"); a native disclosure with Escape closing it and returning focus to its button, links for choices (new tab works), 44px targets on touch, a labelled star per row; at 390 the panel is pinned to the viewport margins and the header stays two rows; one control in the base state, no extra chrome
